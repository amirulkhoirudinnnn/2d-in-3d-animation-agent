
name: Render Video Remotion

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npm run render:video -- out/demo/Demo_Video_Final.mp4

      - name: Simpan hasil MP4
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video-remotion
          path: out/demo/Demo_Video_Final.mp4
          if-no-files-found: error
          retention-days: 7
